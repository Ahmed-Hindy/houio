name: CI

on:
  push:
    branches:
      - master
      - "experiment/**"
      - "refactor/**"
  pull_request:

permissions:
  contents: read

jobs:
  windows-msvc:
    runs-on: windows-2022
    strategy:
      matrix:
        preset:
          - windows-msvc-release
          - windows-msvc-werror
          - windows-msvc-analysis
          - windows-msvc-asan

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configure MSVC environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $installationPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installationPath) {
            throw "A Visual Studio installation with the x64 C++ toolchain was not found"
          }

          $developerCommand = Join-Path $installationPath "Common7/Tools/VsDevCmd.bat"
          $environment = & $env:ComSpec /d /s /c `
            "`"$developerCommand`" -no_logo -arch=x64 -host_arch=x64 && set"
          if ($LASTEXITCODE -ne 0) {
            throw "VsDevCmd.bat failed with exit code $LASTEXITCODE"
          }

          foreach ($line in $environment) {
            $separator = $line.IndexOf("=")
            if ($separator -le 0) {
              continue
            }
            $name = $line.Substring(0, $separator)
            $value = $line.Substring($separator + 1)
            [System.IO.File]::AppendAllText(
              $env:GITHUB_ENV,
              "$name=$value$([Environment]::NewLine)")
          }

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        if: matrix.preset != 'windows-msvc-analysis'
        run: ctest --preset ${{ matrix.preset }}

      - name: Build Houdini package
        if: matrix.preset == 'windows-msvc-release'
        run: cmake --build --preset windows-msvc-release --target houio_houdini_package

  linux-gcc:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        preset:
          - linux-gcc-release
          - linux-gcc-ubsan

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  linux-gcc-openvdb:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install OpenVDB development package
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libboost-iostreams-dev \
            libopenvdb-dev

      - name: Resolve OpenVDB CMake module
        shell: bash
        run: |
          openvdb_cmake_dir="$(dirname "$(dpkg -L libopenvdb-dev | grep '/FindOpenVDB.cmake$' | head -n 1)")"
          test -n "$openvdb_cmake_dir"
          echo "OPENVDB_CMAKE_DIR=$openvdb_cmake_dir" >> "$GITHUB_ENV"

      - name: Validate named OpenVDB product profile
        run: cmake --preset linux-gcc-core-openvdb -DCMAKE_MODULE_PATH="$OPENVDB_CMAKE_DIR"

      - name: Build named OpenVDB product profile
        run: cmake --build --preset linux-gcc-core-openvdb

      - name: Configure OpenVDB test backend
        run: |
          cmake -S . -B build/linux-gcc-openvdb -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_MODULE_PATH="$OPENVDB_CMAKE_DIR" \
            -DHOUIO_ENABLE_OPENVDB=ON \
            -DHOUIO_BUILD_TESTS=ON \
            -DHOUIO_BUILD_TOOLS=ON

      - name: Build OpenVDB backend
        run: cmake --build build/linux-gcc-openvdb

      - name: Test OpenVDB backend
        run: ctest --test-dir build/linux-gcc-openvdb --output-on-failure

      - name: Upload constructed native VDB fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: houio-constructed-native-vdb
          path: build/linux-gcc-openvdb/tests/openvdb_constructed.bgeo
          if-no-files-found: error

  linux-clang-fuzzer:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configure
        run: cmake --preset linux-clang-fuzzer

      - name: Build
        run: cmake --build --preset linux-clang-fuzzer

      - name: Fuzz parser smoke test
        run: ./build/linux-clang-fuzzer/houio_fuzz_parser -runs=2000 -max_len=512 -timeout=5
